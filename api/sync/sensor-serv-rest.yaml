openapi: 3.0.4
info:
  title: Warmhouse Sensor Management Service REST API
  description: |-
    This is a REST API specification for Warmhouse Sensor Management Service.
  version: 1.0.0
servers:
  - url: https://sensor-serv.warmhouse.ru/api/v1
tags:
  - name: sensor
    description: Operations about sensors
paths:
  /sensor:
    post:
      tags:
        - sensor
      summary: Create sensor.
      description: This can only be done by the logged in user.
      operationId: createSensor
      requestBody:
        description: Created sensor object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Sensor'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sensor'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /sensor/{id}:
    get:
      tags:
        - sensor
      summary: Get sensor by id.
      security:
        - BearerAuth: []
      description: Get sensor details based on id.
      operationId: getSensorById
      parameters:
        - name: id
          in: path
          description: The id of the sensor that needs to be fetched
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sensor'
        '404':
          description: Sensor not found
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags:
        - sensor
      summary: Update sensor resource.
      security:
        - BearerAuth: []
      description: This can only be done by the logged in user.
      operationId: updateSensor
      parameters:
        - name: id
          in: path
          description: the id of the sensor that need to be updated
          required: true
          schema:
            type: integer
      requestBody:
        description: Update an existent sensor in the store
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Sensor'
      responses:
        '200':
          description: successful operation
        '400':
          description: bad request
        '404':
          description: sensor not found
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /sensorsByUser/{login}:
    get:
      tags:
        - sensor
      summary: Get sensors by login.
      security:
        - BearerAuth: []
      description: Get sensors details based on the user's login.
      operationId: getSensorsByUser
      parameters:
        - name: login
          in: path
          description: The login of the user whose sensors need to be fetched
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SensorList'
        '404':
          description: Sensor not found
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /sensor/{id}/command:
    post:
      tags:
        - sensor
      summary: Sends a command to the sensor.
      security:
        - BearerAuth: []
      description: Sends a command to the sensor.
      operationId: sendCommand
      parameters:
        - name: id
          in: path
          description: the id of the sensor that the command must be sent to
          required: true
          schema:
            type: integer
      requestBody:
        description: A command to be sent
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Command'
      responses:
        '200':
          description: Successful operation
        '403':
          description: The user is not logged in
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    Sensor:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 10
        userId:
          type: integer
          format: int64
          example: 10
        type:
          type: string
          example: heater
        model:
          type: string
          example: Russell Hobbs Oscillating Ceramic 2kW Heater
        name:
          type: string
          example: 'bedroom heater'
        location:
          type: string
          example: 'country house'
        state:
          type: integer
          format: int32
          example: 0
        status:
          type: integer
          description: User Status
          format: int32
          example: 1
        lastUpdated:
          type: string
          description: Last updated timestamp
          format: date-time
          example: '2025-10-31T01:30:00.000-03:00'
    SensorList:
      type: array
      items:
        $ref: '#/components/schemas/Sensor'
    Command:
      type: object
      properties:
        sensorId:
          type: integer
          format: int64
          example: 10325
        capabilityId:
          type: integer
          format: int32
          example: 5
        command:
          type: object
        timeStamp:
          type: string
          description: Creation timestamp
          format: date-time
          example: '2025-10-31T01:30:00.000-03:00'
    ApiResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        type:
          type: string
        message:
          type: string
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      required:
        - code
        - message
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
    BearerAuth:
      type: http
      scheme: bearer
